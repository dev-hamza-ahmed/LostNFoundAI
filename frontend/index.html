<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3F6B5B">
<title>Lost n Found AI</title>
<link rel="icon" type="image/png" href="./images/logo.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="device">
  <div class="app">

    <!-- App bar (rendered by JS) -->
    <header class="appbar" id="appbar"></header>

    <!-- Screen container (rendered by JS) -->
    <main class="screen" id="screen"></main>

    <!-- Bottom navigation (rendered by JS) -->
    <nav class="tabbar" id="tabbar"></nav>

    <!-- Floating report button -->
    <button class="fab" id="fab" aria-label="Report an item">
      <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <!-- Sheets / modals -->
    <div class="backdrop" id="backdrop"></div>

    <!-- Splash / onboarding overlay -->
    <div class="overlay" id="splash">
      <div class="splash">
        <div class="logo"><svg class="ic" viewBox="0 0 24 24" style="stroke:#fff;fill:none;stroke-width:1.8"><circle cx="12" cy="12" r="9"/><path d="m16 8-2.4 5.6L8 16l2.4-5.6z"/></svg></div>
        <h1>Lost n Found AI</h1>
        <p>Smarter Matching. Faster Recovery.</p>
        <div class="load"><i></i></div>
      </div>
    </div>
    <div class="overlay" id="onboarding" style="display:none"></div>

  </div>
</div>

<script src="js/art.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
